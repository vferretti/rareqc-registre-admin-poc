# Portail admin RareQC.
# Prérequis : la plateforme partagée (postgres + keycloak) doit tourner —
# `docker compose up -d` dans le repo rareqc-infra (crée le réseau rareqc-net).
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8082:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rareqc
      POSTGRES_PASSWORD: rareqc
      POSTGRES_DB: rareqc_registre
    # postgres vit dans la composition rareqc-infra : pas de depends_on
    # possible entre projets — restart couvre l'attente au démarrage.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - rareqc-net

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: seed
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rareqc
      POSTGRES_PASSWORD: rareqc
      POSTGRES_DB: rareqc_registre
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - dev
    networks:
      - rareqc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rareqc-net

networks:
  rareqc-net:
    external: true
